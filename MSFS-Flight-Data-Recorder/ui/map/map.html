    leftHtml += row('Bank', Number(t.bankDegrees).toFixed(1) + '°');
    leftHtml += row('Heading', contactHeadingLabel(t, popupHeadingLabels));
    var crab = contactCrabLabel(t);
    if (crab) leftHtml += row('Crab', crab);

    // Gated on t.runway, not "distanceLength >= 0" -- see finishAnalysisPrompt().
    if (t.runway) {
        leftHtml += div;
        leftHtml += row('Threshold', roundHalfAwayFromZero(t.distanceLength) + ' ft (' + roundHalfAwayFromZero(t.distanceLengthPercent * 100) + '%)');
        var cSide = t.distanceWidth >= 0 ? 'R' : 'L';
        leftHtml += row('Centerline', Math.round(Math.abs(t.distanceWidth)) + ' ft ' + cSide + ' (' + Math.round(Math.abs(t.distanceWidthPercent) * 100) + '%)');
    }

    leftHtml += div;
    leftHtml += row('Wind', t.windDirection + '° T / ' + t.windVelocity + ' kt');
    leftHtml += row('Zulu', t.zuluTime);
    if (t.localTime) leftHtml += row('Local', t.localTime);

    leftHtml += '</div>';
    var left = leftHtml;

    // Right column: the Analyze button, the evaluation checkbox
    // (aiProgressEvaluation()) over the model drop-down, and the Copy Prompt
    // button, both buttons as tall as the two; the Other model field,
    // and the result area (pre-filled from DB if available). The choices are
    // shown once the popup opens (showAiChoices()). Copy Prompt, and so the
    // checkbox, works without an API key.
    var hasKey = !!(window._geminiApiKey && window._geminiApiKey.trim().length > 0);
    var disabledAttr = hasKey ? '' : ' disabled title="Set gemini_api_key in settings.ini to enable"';
    var modelDisabledAttr = hasKey ? '' : ' disabled';
    var modelOptions = AI_MODELS.map(function(m) { return '<option value="' + m + '">' + m + '</option>'; }).join('')
        + '<option value="' + AI_MODEL_OTHER + '">Other…</option>';
    var clickAttr = hasKey ? ' onclick="' + analyzeFn + '(\'' + id + '\')"' : '';
    var initialResult = hasKey ? '' :
        '<span style="color:#aaa;font-size:11px;line-height:1.6">To enable AI analysis,<br>'
        + 'add your Gemini API key in settings.ini:<br>'
        + '<code style="background:#f3f4f6;padding:1px 4px;border-radius:3px;color:#555">[ai]<br>gemini_api_key=YOUR_KEY</code><br>'
        + 'then restart the app.</span>';
    var right = [
        '<div style="border-left:1px solid #e5e7eb;padding-left:14px;min-width:380px">',
        '  <div class="td-analyze-label">✦ AI Analysis</div>',
        '  <div style="display:flex">',
        '    <button class="td-analyze-btn" id="td-btn-' + id + '"' + disabledAttr + clickAttr + '>',
        '      ✦ Analyze',
        '    </button>',
        '    <div class="td-ai-choices">',
        '      <label class="td-progress-option">'
            + '<input type="checkbox" id="td-progress-' + id + '" onchange="aiProgressChosen(this.checked)">'
            + ' Progress evaluation<span class="td-tip" id="td-progress-tip-' + id + '">' + aiProgressTooltip(analyzeFn) + '</span></label>',
        '      <select class="td-model-select" id="td-model-' + id + '" title="The model the analysis uses"' + modelDisabledAttr
            + ' onchange="aiModelChosen(\'' + id + '\', this.value)">' + modelOptions + '</select>',
        '    </div>',
        '    <span id="td-spin-' + id + '" class="td-spinner" style="display:none">↻</span>',
        '    <button class="td-copy-btn" id="td-copy-' + id + '" title="Copy the prompt Analyze sends to the clipboard"'
            + ' onclick="' + COPY_PROMPT_FNS[analyzeFn] + '(\'' + id + '\')">Copy Prompt</button>',
        '  </div>',
        '  <div id="td-custom-' + id + '" class="td-custom-model" style="display:none">',
        '    <input type="text" id="td-custom-name-' + id + '" placeholder="Model name" spellcheck="false"' + modelDisabledAttr
            + ' oninput="aiCustomModelEdited(\'' + id + '\', this.value)">',
        '    <div class="td-hint">To avoid typos, copy the name with the <b>Copy to clipboard</b> button in'
            + ' Google AI Studio\'s model selection dialog and paste it here.</div>',
        '    <div id="td-model-problem-' + id + '" class="td-model-problem"></div>',
        '  </div>',
        '  <div id="td-note-' + id + '" class="td-note" style="display:none">',
        '    The ' + TRAJECTORY_NAMES[analyzeFn] + ' trajectory couldn\'t be built from this trip\'s',
        '    recorded samples, so this analysis covers the ' + title.toLowerCase() + ' itself only.',
        '  </div>',
        '  <div id="td-result-' + id + '"',
        '       style="margin-top:9px;font-size:11px;line-height:1.6;height:260px;overflow-y:auto;color:#374151">',
        initialResult,
        '  </div>',
        '</div>'
    ].join('');

    var html = '<div style="display:flex;gap:14px;align-items:flex-start;width:650px">' + left + right + '</div>';
    return { html: html, id: id };
}

}

function touchdownPopupHtml(t) {
    var id = 'td' + (++_tdIdx);

function eventPopupHtml(events) {
    var header = events.length === 1 ? '<b>Event</b>' : '<b>Events (' + events.length + ')</b>';
    var items = events.map(function (e) {
        return '<div style="margin:3px 0">• ' + escapeHtml(e.event)

    }).join('');
    return header + '<div style="margin:10px 0">' + items + '</div>';
}

// ── Map helpers ──────────────────────────────────────────────────────────────

function nearestIndexIn(latLngs, lat, lng) {
    var best = 0;
    var bestDist = Infinity;
    for (var i = 0; i < latLngs.length; i++) {
        var dLat = latLngs[i][0] - lat;
        var dLng = latLngs[i][1] - lng;
        var dist = dLat * dLat + dLng * dLng;
        if (dist < bestDist) {
            bestDist = dist;
            best = i;
        }
    }
    return best;
}

// Translates the map's current viewport into a [minIndex, maxIndex] range
// over trajectoryLatLngs so the charts can zoom their time axis to match.
// Reports (-1, -1) when the whole trajectory is in view, which C++ treats as
// "reset to full range".
// Expands the found range by ±1 decimated step so polyline segments that
// enter or exit the viewport are included even though their outer endpoint
// is not strictly inside bounds. Falls back to the nearest-point segment
// when no decimated point falls inside the viewport at all.
// version is the trajectory's (setTrajectory()'s data.version), so C++ can
// drop a range measured on a trip it has since replaced.
function reportVisibleRange(trajectoryLatLngs, origIndices, version, bounds) {
    if (!mapBridge || trajectoryLatLngs.length === 0)
        return;
    var n = trajectoryLatLngs.length;
    var minIdx = -1, maxIdx = -1;
    for (var i = 0; i < n; i++) {
        if (bounds.contains([trajectoryLatLngs[i][0], trajectoryLatLngs[i][1]])) {
            if (minIdx === -1) minIdx = i;
            maxIdx = i;
        }
    }
    if (minIdx === -1) {
        // No decimated point inside the viewport -- the map may be showing only
        // the interior of one long decimated segment. Find the decimated
        // vertex nearest the viewport centre.
        var c = bounds.getCenter();
        var bestIdx = nearestIndexIn(trajectoryLatLngs, c.lat, c.lng);
        // Include the full segment on each side of bestIdx so the chart covers
        // the trajectory visible on the map even when the viewport is smaller
        // than one decimated stride.
        var lo = Math.max(0, bestIdx - 1);
        var hi = Math.min(n - 1, bestIdx + 1);
        mapBridge.rangeChanged(origIndices[lo], origIndices[hi], version);
        return;
    }
    // Expand by one decimated step on each side: the polyline segment entering
    // the viewport from outside (minIdx-1 → minIdx) and the segment exiting
    // (maxIdx → maxIdx+1) are both visible on the map but their outer endpoints
    // are not "inside" bounds. Including them makes the chart time range match
    // what the user actually sees.
    if (minIdx > 0) minIdx--;
    if (maxIdx < n - 1) maxIdx++;
    if (minIdx <= 0 && maxIdx >= n - 1)
        mapBridge.rangeChanged(-1, -1, version);
    else
        mapBridge.rangeChanged(origIndices[minIdx], origIndices[maxIdx], version);
}

// Called once per page load (MapWidget::refreshProvider()), each into a fresh
// JS context, so there's never an earlier map to tear down.
function initProvider() {
    initLeafletProvider();
}

// ── Group color/shape encoding for the overview map ─────────────────────────
// Each trip group gets a stable (color, shape) pair derived from groupRank --
// its 1-based position in the Manage Groups list order (trip_groups.sort_order,
// ties broken by name), stamped onto every segment by TripHistoryPanel
// (trip_history_panel.cpp's groupRank_) from the *full* group list, never from
// just whatever subset of groups the currently-filtered/displayed segments
// happen to contain -- so a group's appearance stays the same whether the map
// is showing all groups or a filtered handful, and only changes when the user
// actually reorders groups in Manage Groups.
// A map is an all-pairs context -- any two groups' markers can end up next
// to each other anywhere, not just as neighbors in a legend list -- so the
// color channel alone must be mutually distinguishable across every pair,
// not merely adjacent ones. Of the 8 hues in the validated categorical
// palette these colors come from, only the first 3 clear that all-pairs bar in
// both light and dark modes; past 3, some pair (e.g. slot 2 orange vs. slot
// 4 yellow) falls below the colorblind-safe separation floor, and no
// reordering of the 8 fixes that -- it's a property of the hues themselves.
// So GROUP_COLORS is capped at those 3 slots, and shape carries the rest of
// the identity load -- see groupStyle() for how ranks map onto the two.
var GROUP_COLORS = ['#2a78d6', '#eb6834', '#1baf7a'];
var GROUP_SHAPES = ['circle', 'square', 'triangle', 'plus', 'star'];
var UNGROUPED_COLOR = '#898781';
// The map basemap (satellite/street tiles) isn't a flat surface -- it's
// blue ocean, green terrain, cream land, colored roads -- so a marker's
// fill hue alone can land on a same-hued patch of tile and disappear. Every
// marker gets a white halo ring behind its dark outline so it stays visible
// against any tile color, light or dark, the way map pin icons conventionally
// do. shapeMarkerHtml() pads its returned glyph by this amount on each side;
// callers must size their icon box to (glyph size + 2 * MARKER_HALO_PAD).
var MARKER_HALO_PAD = 2;

// Leaflet's default fitBounds pan/zoom animation (0.25s) reads as an abrupt
// snap for the map-wide moves this app uses it for (switching trips,
// changing the group filter, resetting zoom) -- slowed down so the motion
// is clearly visible.
var MAP_FIT_BOUNDS_DURATION = 0.75;

function groupStyle(groupRank) {
    if (!groupRank) return { color: UNGROUPED_COLOR, shape: 'x' };
    // Color cycles fully (all 3) for each shape before the shape advances --
    // rank 1..3 are shape A in each of the 3 colors, 4..6 are shape B, etc. --
    // filling the (color, shape) grid in order rather than stepping through
    // it diagonally, as advancing both indices every rank did. All 3*5 = 15
    // combos come before one repeats. Rank is 1-based, so subtract 1 before
    // the modulo split.
    var i = groupRank - 1;
    var colorIdx = i % GROUP_COLORS.length;
    var shapeIdx = Math.floor(i / GROUP_COLORS.length) % GROUP_SHAPES.length;
    return {
        color: GROUP_COLORS[colorIdx],
        shape: GROUP_SHAPES[shapeIdx]
    };
}

function starPolygonPoints(cx, cy, outerR, innerR) {
    var pts = [];
    for (var i = 0; i < 10; i++) {
        var r = (i % 2 === 0) ? outerR : innerR;
        var angle = i * Math.PI / 5 - Math.PI / 2;
        pts.push((cx + r * Math.cos(angle)).toFixed(2) + ',' + (cy + r * Math.sin(angle)).toFixed(2));
    }
    return pts.join(' ');
}

// Renders one group's endpoint marker as a small inline SVG filled with its
// color (or an "x" glyph for ungrouped trips), wrapped in a white
// halo ring (see MARKER_HALO_PAD) so it stays visible on any basemap tile
// color. Pure function of (shape, color, size) -- no user-controlled text
// ever flows through here, so building it via string concatenation/innerHTML
// is safe. Returned markup always measures (size + 2*MARKER_HALO_PAD) square;
// callers must size their icon box (and center anchor) to match.
function shapeMarkerHtml(shape, color, size) {
    size = size || 10;
    var pad = MARKER_HALO_PAD;
    var total = size + pad * 2;
    var half = pad + size / 2;
    if (shape === 'x') {
        return '<div style="width:' + total + 'px;height:' + total + 'px;display:flex;'
            + 'align-items:center;justify-content:center">'
            + '<div style="line-height:' + size + 'px;text-align:center;color:' + color + ';'
            + 'font-size:' + (size + 1) + 'px;font-weight:bold;'
            + 'text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff">&times;</div></div>';
    }
    var body;
    switch (shape) {
        case 'square':
            body = '<rect x="' + (pad + 1) + '" y="' + (pad + 1) + '" width="' + (size - 2) + '" height="' + (size - 2) + '" />';
            break;
        case 'triangle':
            body = '<polygon points="' + half + ',' + (pad + 1) + ' ' + (pad + size - 1) + ',' + (pad + size - 1) + ' ' + (pad + 1) + ',' + (pad + size - 1) + '" />';
            break;
        case 'plus':
            // A plus/cross reads as its own distinct silhouette at any size,
            // unlike a diamond -- which is just a square rotated 45 deg and
            // gets confused with the 'square' shape once both are small and
            // share a color. 12-point polygon: an inner square notch cut
            // from each corner of the (size-2) box leaves a plus shape with
            // arm thickness box/3, centered on the same box the other shapes use.
            var plusX0 = pad + 1, plusX1 = pad + size - 1;
            var plusY0 = pad + 1, plusY1 = pad + size - 1;
            var plusBox = size - 2;
            var plusArm = plusBox / 3;
            var plusInset = (plusBox - plusArm) / 2;
            var plusXa = plusX0 + plusInset, plusXb = plusX0 + plusInset + plusArm;
            var plusYa = plusY0 + plusInset, plusYb = plusY0 + plusInset + plusArm;
            body = '<polygon points="'
                + plusXa + ',' + plusY0 + ' ' + plusXb + ',' + plusY0 + ' ' + plusXb + ',' + plusYa + ' '
                + plusX1 + ',' + plusYa + ' ' + plusX1 + ',' + plusYb + ' ' + plusXb + ',' + plusYb + ' '
                + plusXb + ',' + plusY1 + ' ' + plusXa + ',' + plusY1 + ' ' + plusXa + ',' + plusYb + ' '
                + plusX0 + ',' + plusYb + ' ' + plusX0 + ',' + plusYa + ' ' + plusXa + ',' + plusYa + '" />';
            break;
        case 'star':
            body = '<polygon points="' + starPolygonPoints(half, half, size / 2 - 0.5, (size / 2 - 0.5) * 0.42) + '" />';
            break;
        case 'circle':
        default:
            body = '<circle cx="' + half + '" cy="' + half + '" r="' + (size / 2 - 1) + '" />';
    }
    // Drawn twice: a thick white halo stroke first (fill:none, so it only
    // contributes a ring, not a filled disc behind the shape), then the real
    // color fill + dark outline on top -- the standard halo+outline+fill
    // stack cartographic pin icons use so a mark reads on any tile color.
    return '<svg width="' + total + '" height="' + total + '" style="display:block;overflow:visible">'
        + '<g fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round">' + body + '</g>'
        + '<g fill="' + color + '" stroke="rgba(0,0,0,0.55)" stroke-width="1">' + body + '</g>'
        + '</svg>';
}

// Builds (and adds to the map) a bottom-left legend listing each group
// present in legendGroups ({groupId: {name, style, groupRank}}), sorted the
// same as the Manage Groups list (groupRank -- see TripHistoryPanel::
// groupRank_) with "Ungrouped" (groupRank 0) pinned first. Clicking an entry
// isolates that group's layers (dims everything else); clicking it again
// restores all layers. layers is the overviewLines array -- each line/marker
// in it must already have .groupId set to the numeric group id it belongs to.
function buildGroupLegend(legendGroups, map, layers) {
    var ids = Object.keys(legendGroups);
    if (ids.length === 0) return null;
    ids.sort(function(a, b) {
        if (a === '0') return -1;
        if (b === '0') return 1;
        return legendGroups[a].groupRank - legendGroups[b].groupRank;
    });

    var control = L.control({ position: 'bottomleft' });
    control.onAdd = function() {
        var container = L.DomUtil.create('div', 'group-legend');
        L.DomEvent.disableClickPropagation(container);
        // The legend scrolls (overflow-y: auto, capped height) once there are
        // more groups than fit -- without this, a wheel scroll over the list
        // also propagates to the map underneath and zooms it instead.
        L.DomEvent.disableScrollPropagation(container);
        var activeId = null; // isolated group id (string), or null = show all

        function applyIsolation() {
            layers.forEach(function(layer) {
                var dim = activeId !== null && String(layer.groupId) !== activeId;
                if (layer.setStyle) layer.setStyle({ opacity: dim ? 0.15 : 0.7 });
                else if (layer.setOpacity) layer.setOpacity(dim ? 0.25 : 1);
            });
            Array.prototype.forEach.call(container.querySelectorAll('.group-legend-item'), function(el) {
                el.classList.toggle('dimmed', activeId !== null && el.dataset.groupId !== activeId);
            });
        }

        ids.forEach(function(id) {
            var g = legendGroups[id];
            var item = document.createElement('div');
            item.className = 'group-legend-item';
            item.dataset.groupId = id;
            var swatch = document.createElement('span');
            swatch.className = 'group-legend-swatch';
            swatch.innerHTML = shapeMarkerHtml(g.style.shape, g.style.color, 12);
            var label = document.createElement('span');
            label.textContent = g.name;
            item.appendChild(swatch);
            item.appendChild(label);
            item.onclick = function() {
                activeId = (activeId === id) ? null : id;
                applyIsolation();
            };
            container.appendChild(item);
        });
        return container;
    };
    control.addTo(map);
    return control;
}

function initLeafletProvider() {
    // preferCanvas: Leaflet's Canvas renderer draws polylines via the 2D
    // Canvas API rather than SVG DOM elements. For a trajectory polyline with
    // 3000+ segments this avoids building a large SVG <path> string and
    // forces a repaint on each update -- Canvas is substantially faster.
    var map = L.map('map', { preferCanvas: true });
    leafletMapInstance = map;
    // Leaflet never fetches a single tile until the map has a view (center +
    // zoom) -- setTrajectory()'s fitBounds() only runs once a trajectory with
    // points exists, so without this the map stays blank (zero tile
    // requests, not a network/auth failure) whenever nothing is selected yet.
    map.setView([0, 0], 2);
    var tileLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
    }).addTo(map);
    tileLayer.on('tileerror', function (e) {
        console.error('tile error: ' + (e.tile && e.tile.src));
    });

    // trajectoryLatLngs: decimated [[lat,lng],...] sent to Leaflet for rendering.
    // origIndices: parallel array of original sample indices (idx from C++) so
    // JS can report correct indices back even after decimation.
    var trajectoryLatLngs = [];
    var origIndices = [];
    var trajectoryVersion = 0;

    // zoomend/moveend fire once the viewport has settled (not on every
    // intermediate drag/zoom frame), so this stays cheap even on long trips.
    map.on('zoomend moveend', function () {
        reportVisibleRange(trajectoryLatLngs, origIndices, trajectoryVersion, map.getBounds());
    });

    var polyline = L.polyline([], { color: 'blue' }).addTo(map);
    var marker = null;
    var liftoffMarkers = [];
    var touchdownMarkers = [];
    var eventMarkers = [];
    var overviewLines = [];
    var eventsVisible = true;
    var groupLegendControl = null;
    // Bounds of the last overview drawn by setOverview(), so resetZoom() can
    // refit to it -- trajectoryLatLngs is empty in overview mode (no single
    // trip is loaded), so resetZoom()'s normal polyline.getBounds() path has
    // nothing to fit to there.
    var overviewBounds = null;

    // Leaflet silently drops an animated zoom asked for while another is
    // still running (Map._tryAnimatedZoom), so a trip selected during the
    // previous trip's fit would be left at that fit. A fit asked for then
    // waits for that zoom to end instead; only the latest one is kept.
    var zoomAnimating = false;
    var deferredFitBounds = null;
    function fitMapTo(bounds) {
        if (zoomAnimating) {
            deferredFitBounds = bounds;
            return;
        }
        map.fitBounds(bounds, { padding: [20, 20], animate: true, duration: MAP_FIT_BOUNDS_DURATION });
    }
    map.on('zoomanim', function () { zoomAnimating = true; });
    map.on('zoomend', function () {
        zoomAnimating = false;
        var bounds = deferredFitBounds;
        deferredFitBounds = null;
        if (bounds !== null)
            fitMapTo(bounds);
    });

    // Tagged with trajectoryVersion, like reportVisibleRange(), so C++ can
    // drop an index into a trip it has since replaced.
    function snapAndReport(decimatedIdx) {
        if (marker !== null)
            marker.setLatLng(trajectoryLatLngs[decimatedIdx]);
        if (mapBridge)
            mapBridge.markerMoved(origIndices[decimatedIdx], trajectoryVersion);
    }

    // Click-to-scrub: clicking anywhere on the trajectory line snaps the
    // cursor marker to the nearest sample and notifies C++, the same way
    // dragging the marker does.
    polyline.on('click', function (e) {
        if (trajectoryLatLngs.length === 0)
            return;
        snapAndReport(nearestIndexIn(trajectoryLatLngs, e.latlng.lat, e.latlng.lng));
    });

    // One marker per liftoff/touchdown point: emoji plus its 1-based index,
    // with popupHtml(t)'s popup; a crashed touchdown's is an airplane
    // nose-down into the runway, in red, instead. Returns the markers.
    function addContactMarkers(points, emoji, className, popupHtml, currentStore) {
        return points.map(function (t, idx) {
            var html = '<div style="position:relative;width:100%;height:100%">' + (t.crashed ? '<span class="crash-plane">\u2708\uFE0F</span><span class="crash-runway"></span>' : emoji) + '<span class="marker-index-badge">' + (idx + 1) + '</span></div>';
            var icon = L.divIcon({ className: className + (t.crashed ? ' crash-icon' : ''), html: html, iconSize: [20, 20], iconAnchor: [10, 10] });
            var m = L.marker([t.lat, t.lng], { icon: icon }).addTo(map);
            var popup = popupHtml(t);
            m.bindPopup(popup.html, { maxWidth: 700 });
            // Re-read the store on every open (rather than capturing
            // t.analysisReport once here) so a report generated after this
            // marker was built -- via analyzeLiftoff()/analyzeTouchdown(),
            // which mutate the same stored object -- still reappears if the
            // popup is closed and reopened without the trip itself reloading.
            m.on('popupopen', function () {
                var stored = currentStore()[popup.id];
                if (stored && stored.analysisReport) renderStoredReport(popup.id, stored.analysisReport);
                if (stored) showAiChoices(popup.id, stored.analyzing ? stored.analysisChoices : undefined);
                if (stored && stored.analyzing) showAnalysisRunning(popup.id, true);
                if (stored) showProfileNotice(popup.id, stored);
            });
            return m;
        });
    }

    function removeMarkers(markers) {
        markers.forEach(function (m) { map.removeLayer(m); });
    }

    function clearOverview() {
        removeMarkers(overviewLines);
        overviewLines = [];
        overviewBounds = null;
        deferredFitBounds = null;  // a waiting fit is for what was shown before
        if (groupLegendControl) {
            map.removeControl(groupLegendControl);
            groupLegendControl = null;
        }
    }

    currentProvider = {
        setTrajectory: function (data) {
            clearOverview();
            // data is {lats:[...], lngs:[...], idxs:[...], version} -- parallel
            // flat arrays are more compact JSON and faster to iterate than an
            // array of {lat, lng, idx} objects.
            var n = data.lats.length;
            trajectoryLatLngs = new Array(n);
            origIndices = data.idxs;
            trajectoryVersion = data.version;
            for (var i = 0; i < n; i++)
                trajectoryLatLngs[i] = [data.lats[i], data.lngs[i]];
            polyline.setLatLngs(trajectoryLatLngs);
            if (n === 0) {
                // No point to put the cursor on: drop the previous trip's
                // marker, which dragging would otherwise snap to nothing.
                if (marker !== null) { map.removeLayer(marker); marker = null; }
                return;
            }

            // Animated so switching trips visibly pans/zooms rather than
            // jump-cutting -- zoomend/moveend (and so the rangeChanged() IPC
            // round-trip that syncs the charts panel's visible range) now
            // fire only once the animation settles, a few hundred ms later
            // than an instant fitBounds would.
            fitMapTo(polyline.getBounds());

            if (marker === null) {
                marker = L.marker(trajectoryLatLngs[0], { draggable: true }).addTo(map);
                marker.on('dragend', function () {
                    var pos = marker.getLatLng();
                    snapAndReport(nearestIndexIn(trajectoryLatLngs, pos.lat, pos.lng));
                });
            } else {
                marker.setLatLng(trajectoryLatLngs[0]);
            }
        },
        setCursorIndex: function (index) {
            if (marker === null || trajectoryLatLngs.length === 0)
                return;
            // Binary search origIndices (sorted) for the closest value to index.
            var lo = 0, hi = origIndices.length - 1, best = 0;
            while (lo <= hi) {
                var mid = (lo + hi) >> 1;
                if (Math.abs(origIndices[mid] - index) < Math.abs(origIndices[best] - index))
                    best = mid;
                if (origIndices[mid] < index) lo = mid + 1;
                else if (origIndices[mid] > index) hi = mid - 1;
                else break;
            }
            marker.setLatLng(trajectoryLatLngs[best]);
        },
        setLiftoffs: function (points) {
            removeMarkers(liftoffMarkers);
            // Every entry belonged to a marker/popup just removed above (and
            // analyzeLiftoff() already no-ops once its popup's DOM is gone,
            // via runAiAnalysis()'s missing td-result check), so nothing
            // still needs them -- without this, _liftoffStore accumulates one entry per
            // liftoff marker ever shown, for the lifetime of the page.
            _liftoffStore = {};
            liftoffMarkers = addContactMarkers(points, '\u{1F6EB}', 'liftoff-icon', liftoffPopupHtml,
                function () { return _liftoffStore; });
        },
        setTouchdowns: function (points) {
            removeMarkers(touchdownMarkers);
            // Same store-reset rationale as setLiftoffs() above.
            _touchdownStore = {};
            touchdownMarkers = addContactMarkers(points, '\u{1F6EC}', 'touchdown-icon', touchdownPopupHtml,
                function () { return _touchdownStore; });
        },
        setEvents: function (points) {
            removeMarkers(eventMarkers);
            eventMarkers = [];
            // Group events within ~11 m of each other (same or adjacent sample)
            // into one marker so overlapping flags don't stack unclickably.
            var THRESHOLD = 0.0001;
            var groups = [];
            points.forEach(function (e) {
                for (var i = 0; i < groups.length; i++) {
                    if (Math.abs(groups[i].lat - e.lat) < THRESHOLD &&
                        Math.abs(groups[i].lng - e.lng) < THRESHOLD) {
                        groups[i].events.push(e);
                        return;
                    }
                }
                groups.push({ lat: e.lat, lng: e.lng, events: [e] });
            });
            groups.forEach(function (g) {
                var count = g.events.length;
                var badge = count > 1
                    ? '<span style="position:absolute;top:0;left:11px;background:#cc2200;color:#fff;border-radius:50%;width:13px;height:13px;font-size:9px;line-height:13px;text-align:center;font-weight:bold;font-family:sans-serif;display:block">' + count + '</span>'
                    : '';
                var iconHtml = '<div style="position:relative;width:26px;height:20px"><span style="font-size:18px;line-height:1">\u{1F6A9}</span>' + badge + '</div>';
                var icon = L.divIcon({ className: 'event-icon', html: iconHtml, iconSize: [26, 20], iconAnchor: [9, 18] });
                var m = L.marker([g.lat, g.lng], { icon: icon });
                m.bindPopup(eventPopupHtml(g.events));
                if (eventsVisible)
                    m.addTo(map);
                eventMarkers.push(m);
            });
        },
        setEventsVisible: function (visible) {
            eventsVisible = visible;
            eventMarkers.forEach(function (m) {
                if (visible) {
                    if (!map.hasLayer(m))
                        m.addTo(map);
                } else if (map.hasLayer(m)) {
                    map.removeLayer(m);
                }
            });
        },
        setOverview: function (segments) {
            map.closePopup();
            // Clear trajectory and markers.
            trajectoryLatLngs = [];
            origIndices = [];
            polyline.setLatLngs([]);
            if (marker !== null) { map.removeLayer(marker); marker = null; }
            // Empty lists: removes the markers and empties the popup stores.
            currentProvider.setLiftoffs([]);
            currentProvider.setTouchdowns([]);
            currentProvider.setEvents([]);
            clearOverview();

            // Marks a segment endpoint so departure/destination points stand out
            // clearly even where several segments' lines overlap or run close
            // together -- a plain polyline alone makes it hard to tell where one
            // segment ends and the next begins. style is {color, shape} from
            // groupStyle(), so endpoints double as the group's identity marks.
            function endpointMarker(lat, lng, style) {
                var glyphSize = 8;
                var total = glyphSize + MARKER_HALO_PAD * 2;
                var icon = L.divIcon({
                    className: 'overview-endpoint',
                    html: shapeMarkerHtml(style.shape, style.color, glyphSize),
                    iconSize: [total, total], iconAnchor: [total / 2, total / 2]
                });
                var m = L.marker([lat, lng], { icon: icon, interactive: false }).addTo(map);
                m.groupId = style.groupId;
                return m;
            }

            var bounds = [];
            var legendGroups = {};
            segments.forEach(function(s) {
                if (s.fromLat === 0 && s.fromLng === 0) return;
                var style = groupStyle(s.groupRank);
                style.groupId = s.groupId || 0;
                legendGroups[style.groupId] = { name: s.groupName || 'Ungrouped', style: style, groupRank: s.groupRank };

                bounds.push([s.fromLat, s.fromLng]);
                overviewLines.push(endpointMarker(s.fromLat, s.fromLng, style));
                if (s.toLat !== 0 || s.toLng !== 0) {
                    var line = L.polyline(
                        [[s.fromLat, s.fromLng], [s.toLat, s.toLng]],
                        { color: style.color, weight: 3, opacity: 0.7 }
                    ).addTo(map);
                    line.groupId = style.groupId;
                    // Group name (row 1) is user-supplied free text (trip_groups.name)
                    // -- built as DOM elements rather than an HTML string so it can
                    // never be interpreted as markup. ICAO codes (row 2) are always
                    // short alphanumeric strings from the airport database, but built
                    // the same way for consistency.
                    var tooltipEl = document.createElement('div');
                    var tooltipNameRow = document.createElement('div');
                    tooltipNameRow.textContent = legendGroups[style.groupId].name;
                    var tooltipIcaoRow = document.createElement('div');
                    tooltipIcaoRow.textContent = (s.fromIcao || '-') + ' → ' + (s.toIcao || '-');
                    tooltipEl.appendChild(tooltipNameRow);
                    tooltipEl.appendChild(tooltipIcaoRow);
                    line.bindTooltip(tooltipEl);
                    // Clicking a segment selects that trip in the history table, the
                    // same as clicking its row there -- lets the map double as a
                    // picker once trips are visually told apart by group color/shape.
                    line.on('click', function() {
                        if (mapBridge) mapBridge.overviewSegmentClicked(s.tripId);
                    });
                    overviewLines.push(line);
                    overviewLines.push(endpointMarker(s.toLat, s.toLng, style));
                    bounds.push([s.toLat, s.toLng]);
                }
            });
            if (bounds.length > 0) {
                overviewBounds = L.latLngBounds(bounds);
                fitMapTo(overviewBounds);
            }
            groupLegendControl = buildGroupLegend(legendGroups, map, overviewLines);
        },
        resetZoom: function () {
            map.closePopup();
            if (trajectoryLatLngs.length > 0)
                fitMapTo(polyline.getBounds());
            else if (overviewBounds !== null)
                fitMapTo(overviewBounds);
        }
    };

}

function setTrajectory(points) {
    if (currentProvider)
        currentProvider.setTrajectory(points);
}

function setCursorIndex(index) {
    if (currentProvider)
        currentProvider.setCursorIndex(index);
}

function setLiftoffs(points) {
    if (currentProvider)
        currentProvider.setLiftoffs(points);
}

function setTouchdowns(points) {
    if (currentProvider)
        currentProvider.setTouchdowns(points);
}

function setEvents(points) {
    if (currentProvider)
        currentProvider.setEvents(points);
}

function setEventsVisible(visible) {
    if (currentProvider)
        currentProvider.setEventsVisible(visible);
}

function setOverview(segments) {
    if (currentProvider)
        currentProvider.setOverview(segments);
}

function resetZoom() {
    if (currentProvider)
        currentProvider.resetZoom();
}

new QWebChannel(qt.webChannelTransport, function (channel) {
    mapBridge = channel.objects.mapBridge;
});
</script>
</body>
</html>
